# Uso tipico en local: solo la base de datos.
#   docker compose up -d postgres
# Stack completo:
#   docker compose up --build

services:
  postgres:
    image: postgres:16-alpine
    container_name: dcplatform-postgres
    environment:
      POSTGRES_DB: dcplatform
      POSTGRES_USER: dcplatform
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dcplatform_local}
    ports:
      # Puerto del HOST configurable: si ya tienes un Postgres local en 5432,
      # define DB_PORT en backend/.env (por ejemplo 5433). Dentro de la red de
      # Docker el puerto siempre es 5432.
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dcplatform"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    # Contexto en la raiz del repo: el build necesita backend/ y database/
    # (las migraciones se empaquetan desde database/migrations).
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: dcplatform-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/dcplatform
      DB_USER: dcplatform
      DB_PASSWORD: ${DB_PASSWORD:-dcplatform_local}
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      JWT_SECRET: ${JWT_SECRET:-cambiar-en-local-minimo-32-caracteres}
      PDF_WORKER_ENABLED: "false"
    ports:
      - "8080:8080"

  worker:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: dcplatform-worker
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: worker
      DB_URL: jdbc:postgresql://postgres:5432/dcplatform
      DB_USER: dcplatform
      DB_PASSWORD: ${DB_PASSWORD:-dcplatform_local}
      JWT_SECRET: ${JWT_SECRET:-cambiar-en-local-minimo-32-caracteres}

volumes:
  pgdata:
