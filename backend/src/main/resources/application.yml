# Configuracion base. Los valores sensibles llegan por variables de entorno.
# NUNCA escribir credenciales reales en este archivo.

spring:
  application:
    name: dcplatform-api

  datasource:
    # El proveedor es Supabase (PostgreSQL gestionado). Ver ADR-0004.
    # Los valores reales viven en backend/.env, que no entra al repositorio.
    # El default apunta al Postgres de docker-compose para que el proyecto
    # siga arrancando en local sin .env.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/dcplatform}
    username: ${DB_USER:dcplatform}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: dcplatform-pool
      maximum-pool-size: ${DB_POOL_SIZE:5}       # los planes gratuitos limitan conexiones
      minimum-idle: ${DB_POOL_MIN_IDLE:1}        # no sostener conexiones ociosas contra el pooler
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:15000}
      validation-timeout: ${DB_VALIDATION_TIMEOUT_MS:5000}
      # El pooler de Supabase corta las conexiones ociosas por su cuenta. Si Hikari
      # las recicla primero, el usuario nunca ve el "connection closed" del primer
      # request despues de un rato sin trafico. keepalive < idle-timeout < max-lifetime.
      keepalive-time: ${DB_KEEPALIVE_MS:120000}      # 2 min
      idle-timeout: ${DB_IDLE_TIMEOUT_MS:300000}     # 5 min
      max-lifetime: ${DB_MAX_LIFETIME_MS:600000}     # 10 min

  jpa:
    hibernate:
      ddl-auto: validate        # el esquema lo maneja Flyway, nunca Hibernate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    # Se puede apagar con FLYWAY_ENABLED=false para probar solo la conectividad
    # contra una base compartida, sin aplicar migraciones desde tu maquina.
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    baseline-on-migrate: true
    schemas: ${DB_SCHEMA:public}

  jackson:
    default-property-inclusion: always
    datatype:
      datetime:
        # Jackson 3 (el que trae Spring Boot 4) movio esta opcion de
        # SerializationFeature a DateTimeFeature. No devolverla a
        # "serialization:": el arranque falla.
        # Fechas en ISO-8601 con zona, nunca epoch (ver CLAUDE.md).
        write-dates-as-timestamps: false

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

server:
  port: ${PORT:8080}
  error:
    include-message: never      # no filtrar detalles internos al cliente

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  db-status:
    # GET /api/v1/public/db-status. En true agrega host, usuario y estado del pool:
    # util en local, informacion de infraestructura de mas en un endpoint publico.
    # Ponerlo en false en staging mientras Spring Security siga desactivada.
    show-details: ${DB_STATUS_DETAILS:true}
  security:
    magic-link-ttl-minutes: 30
    jwt-secret: ${JWT_SECRET:}          # obligatorio en staging
  rate-limit:
    leads-per-email-per-hour: 3
    leads-per-ip-per-hour: 10
  benchmark:
    min-cohort-size-for-percentile: 5   # regla anti-desanonimizacion
  pdf:
    template-version: "1.0.0"
    signed-url-ttl-days: 7
    worker-enabled: ${PDF_WORKER_ENABLED:true}
  email:
    provider: ${EMAIL_PROVIDER:brevo}
    api-key: ${EMAIL_API_KEY:}
    from-address: ${EMAIL_FROM:}
    daily-quota: ${EMAIL_DAILY_QUOTA:300}
  storage:
    endpoint: ${STORAGE_ENDPOINT:}
    bucket: ${STORAGE_BUCKET:}
    access-key: ${STORAGE_ACCESS_KEY:}
    secret-key: ${STORAGE_SECRET_KEY:}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    root: INFO
    com.dcplatform: DEBUG

---
# Perfil del worker: mismo artefacto, sin exponer la API publica
spring:
  config:
    activate:
      on-profile: worker
app:
  pdf:
    worker-enabled: true
