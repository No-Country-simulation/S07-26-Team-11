# Configuracion base. Los valores sensibles llegan por variables de entorno.
# NUNCA escribir credenciales reales en este archivo.

spring:
  application:
    name: dcplatform-api

  datasource:
    url: jdbc:postgresql://localhost:5432/dcplatform
    username: dcplatform
    password: postgres
    driver-class-name: org.postgresql.Driver

  hikari:
    pool-name: dcplatform-pool
    maximum-pool-size: ${DB_POOL_SIZE:5}
    minimum-idle: ${DB_POOL_MIN_IDLE:1}
    connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:15000}
    validation-timeout: ${DB_VALIDATION_TIMEOUT_MS:5000}
    keepalive-time: ${DB_KEEPALIVE_MS:120000}
    idle-timeout: ${DB_IDLE_TIMEOUT_MS:300000}
    max-lifetime: ${DB_MAX_LIFETIME_MS:600000}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    baseline-on-migrate: true
    schemas: ${DB_SCHEMA:public}

  thymeleaf:
    cache: ${THYMELEAF_CACHE:false}

  jackson:
    default-property-inclusion: always
    datatype:
      datetime:
        write-dates-as-timestamps: false

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

server:
  port: ${PORT:8080}
  error:
    include-message: never

app:
  openapi:
    staging-url: ${OPENAPI_STAGING_URL:https://s07-26-team-11-api.onrender.com}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,https://capacia.vercel.app}
    frontend-url: ${FRONTEND_URL:https://capacia.vercel.app}

  db-status:
    show-details: ${DB_STATUS_DETAILS:true}

  security:
    magic-link-ttl-minutes: 30
    jwt-secret: ${JWT_SECRET:claveSecretaSuperLargaParaQueNoFalleEnLocal123456789}

  rate-limit:
    leads-per-email-per-hour: 3
    leads-per-ip-per-hour: 10

  benchmark:
    min-cohort-size-for-percentile: 5

  pdf:
    template-version: "1.0.0"
    signed-url-ttl-days: 7
    max-attempts: 3
    worker-enabled: ${PDF_WORKER_ENABLED:true}

  documents:
    assets-location: ${DOCUMENTS_ASSETS_LOCATION:classpath:assets/}
    logo-file: ${DOCUMENTS_LOGO_FILE:logo.svg}
    template: pdf/institutional-document
    template-version: "1.0.0"
    storage-prefix: ${DOCUMENTS_STORAGE_PREFIX:documents/}

    organization:
      name: ${DOCUMENTS_ORG_NAME:Capacia}
      tagline: ${DOCUMENTS_ORG_TAGLINE:Plataforma de Benchmark de Data Centers}
      footer-note: ${DOCUMENTS_ORG_FOOTER:Documento generado automáticamente. Uso interno.}
      meeting-link: ${DOCUMENTS_ORG_MEETING_LINK:https://capacia.vercel.app/benchmark/reunion}
      contact-email: ${DOCUMENTS_ORG_CONTACT_EMAIL:andres.segura.dev@gmail.com}

  email:
    provider: ${EMAIL_PROVIDER:brevo}
    api-key: ${EMAIL_API_KEY:x-dummy-api-key}
    from-address: ${EMAIL_FROM:}
    from-name: ${EMAIL_FROM_NAME:Capacia}
    daily-quota: ${EMAIL_DAILY_QUOTA:300}

  storage:
    oci:
      bucket-name: ${OCI_BUCKET_NAME:}
      namespace: ${OCI_NAMESPACE:}
      region: ${OCI_REGION:}
      tenancy-ocid: ${OCI_TENANCY_OCID:}
      user-ocid: ${OCI_USER_OCID:}
      fingerprint: ${OCI_FINGERPRINT:}
      private-key-path: ${OCI_PRIVATE_KEY_PATH:}
      private-key-base64: ${OCI_PRIVATE_KEY_BASE64:}
      private-key-passphrase: ${OCI_PRIVATE_KEY_PASSPHRASE:}
      signed-url-ttl: ${OCI_SIGNED_URL_TTL:15m}
      key-prefix: ${OCI_KEY_PREFIX:benchmark-reports/}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    root: INFO
    com.dcplatform: DEBUG
    com.openhtmltopdf: WARN

# ---------------------------------------------------------
# VARIABLES GLOBALES
# ---------------------------------------------------------

client:
  api:
    mock:
      enabled: true

---
spring:
  config:
    activate:
      on-profile: worker

app:
  pdf:
    worker-enabled: true