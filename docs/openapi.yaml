      properties:
        name:
          type: string
          description: 'Nombre del documento, sin la extension .pdf. Unico por usuario:
            regenerar con el mismo nombre reemplaza el documento anterior. Solo letras,
            digitos, ''.'', ''-'' y ''_''.'
          example: informe-benchmark
          minLength: 1
          pattern: '[A-Za-z0-9][A-Za-z0-9._-]{0,63}'
      required:
      - name
